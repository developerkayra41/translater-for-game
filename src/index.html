<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <title>Çeviri Paneli</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", sans-serif;
      user-select: none;
    }

    #panel {
      position: relative;

      box-sizing: border-box;
      width: 100%;
      height: 100%;

      padding: 10px 14px;

      display: flex;
      flex-direction: column;

      background: rgba(0, 0, 0, 0.62);

      color: rgba(255, 255, 255, 0.95);

      border: none;
      border-radius: 8px;

      overflow: hidden;

      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.25);

      cursor: default;
    }

    /* ------------------------- */
    /* TOOLBAR */
    /* ------------------------- */

    #toolbar {
      display: none;

      align-items: center;

      gap: 6px;

      margin-bottom: 8px;

      flex-shrink: 0;

      position: relative;
      z-index: 10;
    }

    #panel.edit #toolbar {
      display: flex;
    }

    #handle {
      flex: 1;

      cursor: move;

      font-size: 12px;

      color: #fbbf24;

      padding: 4px 0;

      white-space: nowrap;
    }

    /* ------------------------- */
    /* BUTTONS */
    /* ------------------------- */

    button {
      border: none;

      border-radius: 4px;

      background: rgba(255, 255, 255, 0.12);

      color: white;

      padding: 3px 8px;

      cursor: pointer;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    /* ------------------------- */
    /* STATUS */
    /* ------------------------- */

    #status {
      flex-shrink: 0;

      font-size: 11px;

      color: rgba(255, 255, 255, 0.65);

      margin-bottom: 5px;

      pointer-events: none;
    }

    /* ------------------------- */
    /* TRANSLATION */
    /* ------------------------- */

    #translated {
      flex: 1;

      min-height: 0;

      overflow-y: auto;

      line-height: 1.45;

      font-size: 18px;

      color: rgba(255, 255, 255, 0.96);

      user-select: text;

      pointer-events: auto;

      text-shadow:
        0 1px 3px rgba(0, 0, 0, 0.9);
    }

    /* ------------------------- */
    /* RESIZE GRIP */
    /* ------------------------- */

    #grip {
      display: none;

      position: absolute;

      right: 0;
      bottom: 0;

      width: 30px;
      height: 30px;

      cursor: nwse-resize;

      z-index: 9999;

      background:
        linear-gradient(135deg,
          transparent 45%,
          rgba(255, 255, 255, 0.35) 46%,
          rgba(255, 255, 255, 0.35) 52%,
          transparent 53%),
        linear-gradient(135deg,
          transparent 60%,
          rgba(255, 255, 255, 0.60) 61%,
          rgba(255, 255, 255, 0.60) 67%,
          transparent 68%);
    }

    #panel.edit #grip {
      display: block;
    }

    /* ------------------------- */
    /* EDIT MODE */
    /* ------------------------- */

    #panel.edit {
      box-shadow:
        0 0 0 1px rgba(245, 158, 11, 0.75),
        0 4px 18px rgba(0, 0, 0, 0.3);
    }

    /* ------------------------- */
    /* HIDDEN */
    /* ------------------------- */

    #panel.hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div id="panel">

    <div id="toolbar">

      <div id="handle">
        ☰ Taşı — Alt+E ile oyuna dön
      </div>

      <button id="fMinus">A−</button>
      <button id="fPlus">A+</button>

    </div>

    <div id="status">
      Hazır — Alt+T ile alan seç
    </div>

    <div id="translated"></div>

    <div id="grip"></div>

  </div>

  <script>

    const panel = document.getElementById("panel");
    const status = document.getElementById("status");
    const translated = document.getElementById("translated");


    // -------------------------
    // FONT SIZE
    // -------------------------

    let fontSize = parseInt(
      localStorage.getItem("fontSize") || "18",
      10
    );

    function applyFont() {

      translated.style.fontSize =
        fontSize + "px";

      localStorage.setItem(
        "fontSize",
        fontSize
      );
    }

    applyFont();


    document.getElementById("fPlus").onclick = () => {

      fontSize = Math.min(
        48,
        fontSize + 2
      );

      applyFont();
    };


    document.getElementById("fMinus").onclick = () => {

      fontSize = Math.max(
        10,
        fontSize - 2
      );

      applyFont();
    };


    // -------------------------
    // MOVE
    // -------------------------

    function makeMove(element) {

      let moving = false;

      let lastX = 0;
      let lastY = 0;

      element.addEventListener(
        "pointerdown",
        (e) => {

          e.preventDefault();
          e.stopPropagation();

          moving = true;

          lastX = e.screenX;
          lastY = e.screenY;

          element.setPointerCapture(
            e.pointerId
          );
        }
      );


      element.addEventListener(
        "pointermove",
        (e) => {

          if (!moving)
            return;

          const dx =
            e.screenX - lastX;

          const dy =
            e.screenY - lastY;

          lastX = e.screenX;
          lastY = e.screenY;

          if (dx === 0 && dy === 0)
            return;

          window.electronAPI.moveBy(
            dx,
            dy
          );
        }
      );


      element.addEventListener(
        "pointerup",
        (e) => {

          moving = false;

          try {

            element.releasePointerCapture(
              e.pointerId
            );

          } catch { }
        }
      );


      element.addEventListener(
        "pointercancel",
        () => {

          moving = false;

        }
      );
    }


    // -------------------------
    // RESIZE
    // -------------------------

    function makeResize(element) {

      let resizing = false;

      let lastX = 0;
      let lastY = 0;


      element.addEventListener(
        "pointerdown",
        (e) => {

          e.preventDefault();
          e.stopPropagation();

          resizing = true;

          lastX = e.screenX;
          lastY = e.screenY;

          element.setPointerCapture(
            e.pointerId
          );
        }
      );


      element.addEventListener(
        "pointermove",
        (e) => {

          if (!resizing)
            return;

          const dw =
            e.screenX - lastX;

          const dh =
            e.screenY - lastY;

          lastX = e.screenX;
          lastY = e.screenY;

          if (dw === 0 && dh === 0)
            return;

          window.electronAPI.resizeBy(
            dw,
            dh
          );
        }
      );


      element.addEventListener(
        "pointerup",
        (e) => {

          resizing = false;

          try {

            element.releasePointerCapture(
              e.pointerId
            );

          } catch { }
        }
      );


      element.addEventListener(
        "pointercancel",
        () => {

          resizing = false;

        }
      );
    }


    makeMove(
      document.getElementById("handle")
    );

    makeResize(
      document.getElementById("grip")
    );


    // -------------------------
    // IPC
    // -------------------------

    window.electronAPI.onEditMode(
      (on) => {

        panel.classList.toggle(
          "edit",
          on
        );

      }
    );


    window.electronAPI.onShowMode(
      (on) => {

        panel.classList.toggle(
          "hidden",
          !on
        );

      }
    );


    window.electronAPI.onTranslationStatus(
      (msg) => {

        status.textContent = msg;

      }
    );


    window.electronAPI.onTranslationResult(
      (text) => {

        status.textContent =
          "Çeviri";

        translated.textContent =
          text;

      }
    );

  </script>

</body>

</html>
